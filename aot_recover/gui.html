<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity 3 iOS AOT Recover</title>
<style>
  :root{
    --accent:#0f6cbd; --accent-h:#115ea3;
    --bg:#f3f5f8; --card:#ffffff; --text:#1a1a1a; --muted:#5c6470;
    --field:#ffffff; --field-ro:#f0f2f5; --border:#d3d8de;
    --ok-bg:#e7f4ea; --ok-bd:#8fce9e; --ok-fg:#0f5132;
    --err-bg:#fdeaea; --err-bd:#e6a4a4; --err-fg:#842029;
    --warn-bg:#fff6e6; --warn-bd:#e8c98a; --warn-fg:#6b4e12;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --card:#171b21; --text:#e7ebf0; --muted:#98a2b0;
      --field:#0f1319; --field-ro:#12161c; --border:#2b323b;
      --ok-bg:#12251a; --ok-bd:#2f6b40; --ok-fg:#8fe0a5;
      --err-bg:#2a1215; --err-bd:#5c2b2e; --err-fg:#ff8a80;
      --warn-bg:#2a2312; --warn-bd:#5c4e2b; --warn-fg:#f0d58a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;padding:26px 16px}
  .app{width:100%;max-width:640px}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:18px 18px 20px;margin-bottom:14px}
  label.f{display:block;font-size:12.5px;font-weight:600;margin:0 0 6px}
  .row{display:flex;gap:8px;margin-bottom:14px;align-items:center}
  .row:last-child{margin-bottom:0}
  input[type=text],select{width:100%;height:33px;padding:0 11px;color:var(--text);
    background:var(--field);border:1px solid var(--border);border-radius:6px;
    font:12px 'Cascadia Code','Consolas',ui-monospace,monospace;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--accent)}
  select{cursor:pointer}
  button{font:600 12.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    border:1px solid var(--border);background:var(--field-ro);color:var(--text);
    height:33px;padding:0 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    height:40px;padding:0 22px;font-size:14px;width:100%}
  button.primary:hover{background:var(--accent-h)}
  button.primary:disabled{opacity:.55;cursor:default}
  button.small{height:33px;padding:0 12px}
  .chk{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .hint{color:var(--muted);font-size:11px;margin:5px 0 0}
  details summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);
    margin-bottom:12px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}
  .refs{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .ref{display:flex;gap:8px;align-items:center;font:12px ui-monospace,monospace;
    background:var(--field-ro);border:1px solid var(--border);border-radius:6px;padding:6px 10px}
  .ref span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref button{height:24px;padding:0 8px;font-size:11px}
  .banner{border-radius:8px;padding:10px 13px;font-size:12px;margin-bottom:14px;border:1px solid}
  .banner.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-fg)}
  #result{display:none;border-radius:10px;padding:16px;margin-top:2px;border:1px solid}
  #result.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-fg);display:block}
  #result.err{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-fg);display:block}
  #result h3{margin:0 0 6px;font-size:14px}
  #result .body{font-size:12.5px;white-space:pre-wrap;font-family:ui-monospace,monospace;
    max-height:34vh;overflow:auto}
  #result .actions{margin-top:12px;display:flex;gap:8px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff88;
    border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <h1>Unity 3 iOS AOT Recover</h1>
  <p class="sub">Recover C# metadata and native Mono AOT method maps from an IPA you own.</p>

  <div id="prereq" class="banner warn" style="display:none"></div>

  <div class="card">
    <label class="f" for="ipa">IPA file</label>
    <div class="row">
      <input type="text" id="ipa" placeholder="Select the .ipa you own…">
      <button class="small" data-pick="ipa" data-target="ipa">Browse…</button>
    </div>

    <label class="f" for="output">Output folder</label>
    <div class="row">
      <input type="text" id="output" placeholder="Where reports &amp; method maps are written…">
      <button class="small" data-pick="folder" data-target="output">Browse…</button>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="no_decompile"> Skip C# decompile (faster)</label>
    </div>

    <details>
      <summary>Advanced</summary>

      <label class="f" for="binary">Decrypted executable <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <div class="row">
        <input type="text" id="binary" placeholder="Authorized same-build Mach-O…">
        <button class="small" data-pick="file" data-target="binary">Browse…</button>
      </div>
      <p class="hint">Same build only. Leave empty if you don't have one.</p>

      <label class="f" for="arch" style="margin-top:14px">Architecture</label>
      <div class="row">
        <select id="arch">
          <option value="all">all</option>
          <option value="armv7">armv7</option>
          <option value="armv6">armv6</option>
        </select>
      </div>

      <label class="f" style="margin-top:14px">Donor / reference managed <span style="font-weight:400;color:var(--muted)">(optional, 0+)</span></label>
      <div class="refs" id="refs"></div>
      <div class="row">
        <button class="small" data-addref="file">Add DLL…</button>
        <button class="small" data-addref="folder">Add folder…</button>
      </div>

      <label class="f" for="ilspycmd" style="margin-top:14px">ilspycmd path</label>
      <div class="row">
        <input type="text" id="ilspycmd" placeholder="Auto-detected on PATH if left empty…">
        <button class="small" data-pick="file" data-target="ilspycmd">Browse…</button>
      </div>
    </details>
  </div>

  <button class="primary" id="run">Recover</button>

  <div id="result"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const refs = [];

async function api(path, opts){ const r = await fetch(path, opts); return r.json(); }

async function pick(kind){
  const r = await api('/pick?kind=' + encodeURIComponent(kind));
  return r.path || '';
}

document.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
  const p = await pick(b.dataset.pick);
  if (p) $(b.dataset.target).value = p;
});

function renderRefs(){
  const box = $('refs'); box.innerHTML = '';
  refs.forEach((path, i) => {
    const row = document.createElement('div'); row.className = 'ref';
    const s = document.createElement('span'); s.textContent = path; s.title = path;
    const x = document.createElement('button'); x.textContent = 'Remove';
    x.onclick = () => { refs.splice(i,1); renderRefs(); };
    row.append(s, x); box.append(row);
  });
}
document.querySelectorAll('[data-addref]').forEach(b => b.onclick = async () => {
  const p = await pick(b.dataset.addref);
  if (p){ refs.push(p); renderRefs(); }
});

async function checkPrereq(){
  try{
    const r = await api('/prereq');
    const miss = [];
    if (!r.dotnet) miss.push('.NET SDK (dotnet) — required for metadata extraction');
    if (!r.ilspy)  miss.push('ilspycmd — required for C# skeletons');
    if (miss.length){
      $('prereq').style.display = 'block';
      $('prereq').innerHTML = 'Missing on this machine:<br>• ' + miss.join('<br>• ');
    }
  }catch(e){}
}
checkPrereq();

$('run').onclick = async () => {
  const btn = $('run'), res = $('result');
  const values = {
    ipa: $('ipa').value, output: $('output').value, binary: $('binary').value,
    arch: $('arch').value, ilspycmd: $('ilspycmd').value,
    no_decompile: $('no_decompile').checked, reference_managed: refs.slice()
  };
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Recovering… this can take a few minutes';
  res.className = ''; res.style.display = 'none';
  let r;
  try{ r = await api('/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(values)}); }
  catch(e){ r = {ok:false, error:'Could not reach the local backend: ' + e}; }
  btn.disabled = false; btn.textContent = 'Recover';

  if (r.ok){
    res.className = 'ok';
    res.innerHTML = '';
    const h = document.createElement('h3'); h.textContent = '✓ ' + (r.title || r.state);
    const b = document.createElement('div'); b.className = 'body'; b.textContent = r.body || '';
    const acts = document.createElement('div'); acts.className = 'actions';
    const folder = $('output').value;
    const bf = document.createElement('button'); bf.textContent = 'Open output folder';
    bf.onclick = () => api('/open', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: folder})});
    const br = document.createElement('button'); br.textContent = 'Open REPORT.md';
    br.onclick = () => api('/open', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: r.report})});
    acts.append(bf, br); res.append(h, b, acts);
  } else {
    res.className = 'err';
    res.innerHTML = '';
    const h = document.createElement('h3'); h.textContent = '✕ Recovery failed';
    const b = document.createElement('div'); b.className = 'body'; b.textContent = r.error || 'Unknown error';
    res.append(h, b);
  }
  res.scrollIntoView({behavior:'smooth', block:'nearest'});
};
</script>
</body>
</html>
